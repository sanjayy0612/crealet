<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" role="img"><ns0:title>Throughput predictor comparison on historical Ghent traces</ns0:title><ns0:desc>On 1,568 forecast decisions, the learned predictor reduced mean absolute error from 13.88 to 10.54 Mbps. Playback completed without stalls and tied the highest-allowed rule on 31 of 32 sessions, while RobustMPC decision latency was about 129 milliseconds.</ns0:desc><ns0:rect x="0" y="0" width="1120" height="470" fill="#ffffff" rx="18" /><ns0:text x="560.0" y="40" fill="#243247" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Better forecast error did not improve playback outcomes</ns0:text><ns0:text x="560.0" y="67" fill="#58677d" font-size="13" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">32 historical Ghent sessions; 80 ms RTT was assumed</ns0:text><ns0:text x="290.0" y="105" fill="#243247" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Forecast error (lower is better)</ns0:text><ns0:line x1="95" y1="305.0" x2="485" y2="305.0" stroke="#dce3ec" stroke-width="1" /><ns0:text x="83" y="310.0" fill="#64748b" font-size="11" text-anchor="end" font-family="Arial, sans-serif" font-weight="normal">0</ns0:text><ns0:line x1="95" y1="260.0" x2="485" y2="260.0" stroke="#dce3ec" stroke-width="1" /><ns0:text x="83" y="265.0" fill="#64748b" font-size="11" text-anchor="end" font-family="Arial, sans-serif" font-weight="normal">4</ns0:text><ns0:line x1="95" y1="215.0" x2="485" y2="215.0" stroke="#dce3ec" stroke-width="1" /><ns0:text x="83" y="220.0" fill="#64748b" font-size="11" text-anchor="end" font-family="Arial, sans-serif" font-weight="normal">8</ns0:text><ns0:line x1="95" y1="170.0" x2="485" y2="170.0" stroke="#dce3ec" stroke-width="1" /><ns0:text x="83" y="175.0" fill="#64748b" font-size="11" text-anchor="end" font-family="Arial, sans-serif" font-weight="normal">12</ns0:text><ns0:line x1="95" y1="125.0" x2="485" y2="125.0" stroke="#dce3ec" stroke-width="1" /><ns0:text x="83" y="130.0" fill="#64748b" font-size="11" text-anchor="end" font-family="Arial, sans-serif" font-weight="normal">16</ns0:text><ns0:rect x="167" y="148.85434528775554" width="72" height="156.14565471224446" rx="5" fill="#2e8b78" /><ns0:text x="203" y="139.85434528775554" fill="#243247" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">13.88 Mbps</ns0:text><ns0:text x="203" y="327" fill="#243247" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Harmonic</ns0:text><ns0:rect x="332" y="186.42203108567702" width="72" height="118.57796891432298" rx="5" fill="#8957a5" /><ns0:text x="368" y="177.42203108567702" fill="#243247" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">10.54 Mbps</ns0:text><ns0:text x="368" y="327" fill="#243247" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">Learned p20</ns0:text><ns0:text x="827.5" y="105" fill="#243247" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Median decision latency (log scale)</ns0:text><ns0:line x1="651.3541666666666" y1="133" x2="651.3541666666666" y2="318" stroke="#dce3ec" stroke-width="1" /><ns0:text x="651.3541666666666" y="336" fill="#64748b" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">0.01</ns0:text><ns0:line x1="744.0625" y1="133" x2="744.0625" y2="318" stroke="#dce3ec" stroke-width="1" /><ns0:text x="744.0625" y="336" fill="#64748b" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">0.1</ns0:text><ns0:line x1="836.7708333333334" y1="133" x2="836.7708333333334" y2="318" stroke="#dce3ec" stroke-width="1" /><ns0:text x="836.7708333333334" y="336" fill="#64748b" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">1</ns0:text><ns0:line x1="929.4791666666667" y1="133" x2="929.4791666666667" y2="318" stroke="#dce3ec" stroke-width="1" /><ns0:text x="929.4791666666667" y="336" fill="#64748b" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">10</ns0:text><ns0:line x1="1022.1875" y1="133" x2="1022.1875" y2="318" stroke="#dce3ec" stroke-width="1" /><ns0:text x="1022.1875" y="336" fill="#64748b" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">100</ns0:text><ns0:rect x="605" y="158" width="39.21421728967767" height="26" rx="5" fill="#2458a6" /><ns0:text x="611" y="153" fill="#243247" font-size="11" text-anchor="start" font-family="Arial, sans-serif" font-weight="bold">Highest allowed</ns0:text><ns0:text x="652.2142172896777" y="176" fill="#243247" font-size="11" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal">0.00838 ms</ns0:text><ns0:rect x="605" y="209" width="427.6402656851504" height="26" rx="5" fill="#2e8b78" /><ns0:text x="611" y="204" fill="#243247" font-size="11" text-anchor="start" font-family="Arial, sans-serif" font-weight="bold">Harmonic RobustMPC</ns0:text><ns0:text x="1040.6402656851503" y="227" fill="#243247" font-size="11" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal">130 ms</ns0:text><ns0:rect x="605" y="260" width="427.2897390034077" height="26" rx="5" fill="#8957a5" /><ns0:text x="611" y="255" fill="#243247" font-size="11" text-anchor="start" font-family="Arial, sans-serif" font-weight="bold">Learned + RobustMPC</ns0:text><ns0:text x="1040.2897390034077" y="278" fill="#243247" font-size="11" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal">129 ms</ns0:text><ns0:text x="1050" y="356" fill="#64748b" font-size="10" text-anchor="end" font-family="Arial, sans-serif" font-weight="normal">ms</ns0:text><ns0:rect x="95" y="390" width="955" height="48" rx="10" fill="#f2f6fb" /><ns0:text x="560.0" y="420" fill="#34445a" font-size="13" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal">All policies completed 32/32 sessions with zero stalls. Learned RobustMPC tied the simple rule on 31/32; one session was worse.</ns0:text></ns0:svg>